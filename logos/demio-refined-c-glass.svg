<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="r3-title">
  <title id="r3-title">Demio Logo — Refined C: Glass Play</title>
  <defs>
    <linearGradient id="r3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4338CA" />
      <stop offset="100%" style="stop-color:#7C3AED" />
    </linearGradient>
    <linearGradient id="r3-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0.05" />
    </linearGradient>
    <linearGradient id="r3-play" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF" />
      <stop offset="100%" style="stop-color:#C7D2FE" />
    </linearGradient>
    <linearGradient id="r3-spark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F59E0B" />
      <stop offset="100%" style="stop-color:#FBBF24" />
    </linearGradient>
    <filter id="r3-shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1E1B4B" flood-opacity="0.5" />
    </filter>
    <filter id="r3-inner-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur" />
      <feFlood flood-color="#A78BFA" flood-opacity="0.3" result="color" />
      <feComposite in="color" in2="blur" operator="in" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="r3-spark-glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="r3-clip">
      <rect x="20" y="20" width="160" height="160" rx="38" ry="38" />
    </clipPath>
  </defs>

  <!-- Drop shadow layer -->
  <rect x="20" y="20" width="160" height="160" rx="38" ry="38" fill="url(#r3-bg)" filter="url(#r3-shadow)" />

  <!-- Clipped content group -->
  <g clip-path="url(#r3-clip)">
    <!-- Base fill -->
    <rect x="20" y="20" width="160" height="160" fill="url(#r3-bg)" />

    <!-- Glassmorphism highlight — top-left curved shine -->
    <ellipse cx="70" cy="50" rx="80" ry="50" fill="url(#r3-glass)" />

    <!-- Subtle grid/texture dots — gives it that modern SaaS feel -->
    <g opacity="0.06" fill="#FFFFFF">
      <circle cx="40" cy="40" r="1.5" />
      <circle cx="60" cy="40" r="1.5" />
      <circle cx="80" cy="40" r="1.5" />
      <circle cx="100" cy="40" r="1.5" />
      <circle cx="120" cy="40" r="1.5" />
      <circle cx="140" cy="40" r="1.5" />
      <circle cx="160" cy="40" r="1.5" />
      <circle cx="40" cy="60" r="1.5" />
      <circle cx="60" cy="60" r="1.5" />
      <circle cx="80" cy="60" r="1.5" />
      <circle cx="100" cy="60" r="1.5" />
      <circle cx="120" cy="60" r="1.5" />
      <circle cx="140" cy="60" r="1.5" />
      <circle cx="160" cy="60" r="1.5" />
      <circle cx="40" cy="80" r="1.5" />
      <circle cx="60" cy="80" r="1.5" />
      <circle cx="80" cy="80" r="1.5" />
      <circle cx="100" cy="80" r="1.5" />
      <circle cx="120" cy="80" r="1.5" />
      <circle cx="140" cy="80" r="1.5" />
      <circle cx="160" cy="80" r="1.5" />
      <circle cx="40" cy="100" r="1.5" />
      <circle cx="60" cy="100" r="1.5" />
      <circle cx="80" cy="100" r="1.5" />
      <circle cx="100" cy="100" r="1.5" />
      <circle cx="120" cy="100" r="1.5" />
      <circle cx="140" cy="100" r="1.5" />
      <circle cx="160" cy="100" r="1.5" />
      <circle cx="40" cy="120" r="1.5" />
      <circle cx="60" cy="120" r="1.5" />
      <circle cx="80" cy="120" r="1.5" />
      <circle cx="100" cy="120" r="1.5" />
      <circle cx="120" cy="120" r="1.5" />
      <circle cx="140" cy="120" r="1.5" />
      <circle cx="160" cy="120" r="1.5" />
      <circle cx="40" cy="140" r="1.5" />
      <circle cx="60" cy="140" r="1.5" />
      <circle cx="80" cy="140" r="1.5" />
      <circle cx="100" cy="140" r="1.5" />
      <circle cx="120" cy="140" r="1.5" />
      <circle cx="140" cy="140" r="1.5" />
      <circle cx="160" cy="140" r="1.5" />
      <circle cx="40" cy="160" r="1.5" />
      <circle cx="60" cy="160" r="1.5" />
      <circle cx="80" cy="160" r="1.5" />
      <circle cx="100" cy="160" r="1.5" />
      <circle cx="120" cy="160" r="1.5" />
      <circle cx="140" cy="160" r="1.5" />
      <circle cx="160" cy="160" r="1.5" />
    </g>

    <!-- Play button — rounded, with subtle gradient -->
    <g filter="url(#r3-inner-glow)">
      <path d="M78,62 C78,57 81,55 85,57.5 L144,93 C148,95.5 148,104.5 144,107 L85,142.5 C81,145 78,143 78,138 Z"
            fill="url(#r3-play)" />
    </g>
  </g>

  <!-- Rounded square border — subtle light stroke -->
  <rect x="20" y="20" width="160" height="160" rx="38" ry="38"
        fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.15" />

  <!-- AI Spark cluster — positioned at top-right, overlapping the edge -->
  <g filter="url(#r3-spark-glow)">
    <g transform="translate(158, 42)">
      <path d="M0,-16 L4.5,-4.5 L16,0 L4.5,4.5 L0,16 L-4.5,4.5 L-16,0 L-4.5,-4.5 Z"
            fill="url(#r3-spark)" />
    </g>
    <circle cx="173" cy="26" r="3.5" fill="#FDE68A" opacity="0.75" />
    <circle cx="175" cy="48" r="2" fill="#FBBF24" opacity="0.5" />
    <circle cx="166" cy="22" r="1.5" fill="#FEF3C7" opacity="0.6" />
  </g>
</svg>
